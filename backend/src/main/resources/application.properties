spring.application.name=GigFlow Backend
server.port=8080
spring.datasource.url=${GIGFLOW_DB_URL:jdbc:postgresql://localhost:5432/gigflow}
spring.datasource.username=${GIGFLOW_DB_USERNAME:gigflow}
spring.datasource.password=${GIGFLOW_DB_PASSWORD:gigflow}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
