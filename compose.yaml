services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gigflow
      POSTGRES_USER: gigflow
      POSTGRES_PASSWORD: gigflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gigflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigflow -d gigflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gigflow-postgres-data:
